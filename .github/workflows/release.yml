# Push a tag like v1.0.0 to build, publish to PyPI and create a GitHub release.
# One-time setup: on pypi.org add a "trusted publisher" for this repository and the workflow
# file release.yml (environment: pypi). No API token is stored anywhere.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: the tag must match the package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('cascade_guard/__init__.py').read())[1])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: pip install -r requirements-dev.txt && ruff check . && pytest -q
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push ghcr.io/<owner>/cascade-guard
        run: |
          img=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr A-Z a-z)/cascade-guard
          docker build -t "$img:${GITHUB_REF_NAME#v}" -t "$img:latest" .
          docker push "$img:${GITHUB_REF_NAME#v}" && docker push "$img:latest"
