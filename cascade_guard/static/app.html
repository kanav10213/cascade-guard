<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<meta name="theme-color" content="#23527c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/pwa.js" defer></script>
<style>
:root{
  --paper:#f2f5f1;--sheet:#ffffff;--ink:#1d2528;--muted:#56646a;--rule:#d3dddf;--rule2:#e6ecec;
  --pen:#c62f28;--pen-soft:#fbe9e7;--ok:#1d7a50;--ok-soft:#e3f2ea;--amber:#8a5a00;--amber-soft:#fff2d6;
  --blue:#23527c;--blue-soft:#e4edf6;--onblue:#fff;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#13181a;--sheet:#1b2225;--ink:#e5ebe9;--muted:#9aa8ab;--rule:#2f3a3e;--rule2:#252e31;
  --pen:#ff7b70;--pen-soft:#3b1f1c;--ok:#5ccf96;--ok-soft:#163326;--amber:#f0c25a;--amber-soft:#3a2e12;
  --blue:#8db8e8;--blue-soft:#1f2d3c;--onblue:#0f1720;
}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:var(--blue)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--sheet);border-right:1px solid var(--rule);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;font-weight:650;padding:4px 8px 12px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
nav button:hover{background:var(--paper)}nav button[aria-current=page]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.badge{background:var(--pen);color:#fff;border-radius:99px;font-size:11.5px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:10px 8px 2px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule2)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;font-size:13px}
main{padding:22px 26px 60px;min-width:0;max-width:1060px}
.top{display:none}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-105%);transition:transform .18s}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--sheet);position:sticky;top:0;z-index:20}
  .top button{background:none;border:1px solid var(--rule);border-radius:8px;padding:4px 10px;cursor:pointer}
  main{padding:16px 14px 60px}
  .scrim.open{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:25}
}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.01em}
p.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.card h2{font-size:16px;margin:0 0 4px}.card p.h{color:var(--muted);font-size:14px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}
.bars i{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars i.z{background:var(--rule)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);flex:none;display:grid;place-items:center;font-size:13px}
.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.done span.t{color:var(--muted);text-decoration:line-through}
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--onblue);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--blue)}.btn.danger{background:none;border-color:var(--pen);color:var(--pen)}.btn.small{padding:3px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.6;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);flex:1;min-width:150px}
label.f input,label.f select,label.f textarea{border:1px solid var(--rule);border-radius:8px;padding:7px 9px;background:var(--paper);color:var(--ink)}
label.c{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--rule2);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.w{white-space:nowrap}
.tag{font-size:12px;border-radius:99px;padding:1px 9px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--amber-soft);color:var(--amber)}.t-info{background:var(--blue-soft);color:var(--blue)}.t-off{background:var(--pen-soft);color:var(--pen)}
.msg{font-size:14px;margin:10px 0 0}.msg.err{color:var(--pen)}.msg.ok{color:var(--ok)}
.new{background:var(--ok-soft);border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.new code,pre{font:12.5px/1.5 var(--mono);word-break:break-all}
pre{background:var(--paper);border:1px solid var(--rule2);border-radius:8px;padding:10px 12px;overflow:auto;margin:8px 0;white-space:pre-wrap}
.drop{border:1.5px dashed var(--rule);border-radius:10px;padding:16px;text-align:center;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.small{font-size:13px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.q{align-self:flex-end;background:var(--blue-soft);border-radius:12px 12px 4px 12px;padding:8px 12px;max-width:85%;white-space:pre-wrap}
.a{white-space:pre-wrap;max-width:75ch}
.src{border:1px solid var(--rule);border-radius:8px;padding:7px 10px;margin:5px 0;font-size:13px;color:var(--muted);white-space:pre-wrap;max-height:9em;overflow:auto}
.strike{text-decoration:line-through;color:var(--pen)}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);padding:14px 0;font-size:14px}
.q-cell{max-width:260px}.a-cell{max-width:420px;color:var(--muted)}
.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="top"><button id="menu" type="button" aria-label="Open menu">☰</button><b id="topname">Dashboard</b></div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="side">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="var(--blue)"/><path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="var(--onblue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div><span id="ws-title">…</span><small id="ws-plan"></small></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot"><div id="me"></div><a class="get-app" href="/get-app" style="display:block;margin:4px 0 2px">Get the phone app</a><button class="linkbtn" id="logout" type="button">Sign out</button></div>
  </aside>
  <main id="main"><p class="small">Loading…</p></main>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(v === null || v === undefined || v === false) continue;
    if(k === 'class') e.className = v; else if(k === 'text') e.textContent = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat()){ if(c === null || c === undefined || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
let apiKey = ''; try{ apiKey = sessionStorage.getItem('cg_key') || ''; }catch(e){}
async function call(path, body, method){
  const headers = {'Content-Type': 'application/json', 'X-CG': '1'};
  if(apiKey) headers['X-API-Key'] = apiKey;
  let r;
  try{ r = await fetch(path, {method: method || (body === undefined ? 'GET' : 'POST'), headers, body: body === undefined ? undefined : JSON.stringify(body)}); }
  catch(e){ throw new Error('The server could not be reached. Check your connection and try again.'); }
  if(r.status === 401){ location.href = '/login'; throw new Error('Please sign in.'); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ let d = j.detail; if(Array.isArray(d)) d = d.map(x => x.msg || '').join('; ') || 'Please check what you typed.'; throw new Error(d || ('The server answered ' + r.status + '.')); }
  return j;
}
const when = iso => iso ? new Date(iso).toLocaleString(undefined, {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '–';
const VERDICT = {checked: ['t-ok', 'Checked'], fixed: ['t-ok', 'Fixed, then checked'], quoted: ['t-ok', 'Quoted'], trimmed: ['t-warn', 'Parts removed'], unconfirmed: ['t-warn', 'Shown with a warning'], not_found: ['t-info', 'Not in documents'], general: ['t-info', 'General answer']};
const tag = v => { const t = VERDICT[v] || ['t-info', v || '?']; return h('span', {class: 'tag ' + t[0], text: t[1]}); };
function note(box, text, ok){ box.replaceChildren(h('p', {class: 'msg ' + (ok ? 'ok' : 'err'), role: ok ? 'status' : 'alert', text})); }
function copyBtn(text, label){ const b = h('button', {class: 'btn ghost small', type: 'button', text: label || 'Copy'}); b.addEventListener('click', async () => { try{ await navigator.clipboard.writeText(text); b.textContent = 'Copied'; }catch(e){ b.textContent = 'Select and copy it'; } }); return b; }
function sure(btn, label, fn){ btn.addEventListener('click', async () => { if(btn.dataset.sure !== '1'){ btn.dataset.sure = '1'; btn.textContent = 'Sure?'; setTimeout(() => { btn.dataset.sure = ''; btn.textContent = label; }, 3500); return; } btn.disabled = true; try{ await fn(); }catch(e){ btn.textContent = e.message; } }); return btn; }

let O = null;   // the overview
const SECTIONS = [['overview', 'Overview'], ['documents', 'Documents'], ['try', 'Try it'], ['conversations', 'Conversations'], ['leads', 'Leads'], ['widget', 'Website widget'], ['team', 'Team'], ['keys', 'API and apps'], ['plan', 'Plan'], ['settings', 'Settings']];
function nav(){
  const box = $('#nav'); box.replaceChildren();
  const cur = (location.hash || '#overview').slice(1);
  for(const [id, label] of SECTIONS){
    box.append(h('button', {type: 'button', 'aria-current': cur === id ? 'page' : null, onclick: () => { location.hash = id; closeSide(); }}, label, id === 'leads' && O && O.open_leads ? h('span', {class: 'badge', text: O.open_leads}) : null));
  }
}
function closeSide(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#menu').addEventListener('click', () => { $('#side').classList.add('open'); $('#scrim').classList.add('open'); });
$('#scrim').addEventListener('click', closeSide);
$('#logout').addEventListener('click', async () => { try{ await call('/auth/logout', {}); }catch(e){} try{ sessionStorage.removeItem('cg_key'); }catch(e){} location.href = '/login'; });

async function boot(){
  try{ O = await call('/app/overview'); }catch(e){ $('#main').replaceChildren(h('p', {class: 'msg err', text: e.message})); return; }
  if(O.you.role === 'member'){ location.href = '/chat'; return; }
  $('#ws-title').textContent = O.workspace.title; $('#topname').textContent = O.workspace.title; document.title = O.workspace.title + ' · Dashboard';
  $('#ws-plan').textContent = 'Plan: ' + O.workspace.plan;
  $('#me').textContent = O.you.name;
  route();
}
const VIEWS = {};
async function route(){
  const id = (location.hash || '#overview').slice(1);
  nav();
  const main = $('#main'); main.replaceChildren(h('p', {class: 'small', text: 'Loading…'}));
  try{ const node = await (VIEWS[id] || VIEWS.overview)(); main.replaceChildren(...[].concat(node)); }
  catch(e){ main.replaceChildren(h('p', {class: 'msg err', text: e.message})); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
const head = (title, sub) => [h('h1', {text: title}), h('p', {class: 'sub', text: sub})];

/* ---------------------------------------------------------------- overview */
VIEWS.overview = async () => {
  O = await call('/app/overview'); nav();
  const s = O.last_30_days, w = O.workspace, out = head('Overview', 'The last 30 days for ' + w.title + '.');
  const setup = [['documents', 'Add your documents or website', O.setup.documents, 'documents'], ['tried', 'Ask a test question', O.setup.tried, 'try'], ['widget', 'Put the chat on your website', O.setup.widget, 'widget'], ['team', 'Invite your team', O.setup.team, 'team']];
  if(setup.some(x => !x[2])) out.push(h('div', {class: 'card'}, h('h2', {text: 'Get set up'}), h('p', {class: 'h', text: 'Four steps to a working assistant.'}),
    h('ul', {class: 'steps'}, setup.map(x => h('li', {class: x[2] ? 'done' : ''}, h('span', {class: 'dot', text: x[2] ? '✓' : ''}), h('span', {class: 't', text: x[1]}), x[2] ? null : h('a', {class: 'btn ghost small', href: '#' + x[3], text: 'Do this'}))))));
  if(!O.ai) out.push(h('div', {class: 'card'}, h('h2', {text: 'Answers are quoted word for word'}), h('p', {class: 'h', style: 'margin:0', text: O.you.role === 'owner' ? 'No AI model is connected to this server, so answers quote the matching lines of the documents. Set CASCADE_AI (or a provider key) on the server for written answers.' : 'Right now the assistant answers by quoting the matching lines of your documents exactly, without rewording them.'})));
  const lim = w.monthly_limit;
  out.push(h('div', {class: 'stats'},
    h('div', {class: 'stat'}, h('b', {text: s.questions}), h('span', {text: 'questions asked'})),
    h('div', {class: 'stat'}, h('b', {text: s.questions ? Math.round(100 * s.answered / s.questions) + '%' : '–'}), h('span', {text: 'answered from your documents'})),
    h('div', {class: 'stat'}, h('b', {text: s.not_found}), h('span', {text: 'not in your documents'})),
    h('div', {class: 'stat'}, h('b', {text: s.warned}), h('span', {text: 'shown with a warning'})),
    h('div', {class: 'stat'}, h('b', {text: lim ? w.used_this_month + ' / ' + lim.toLocaleString() : w.used_this_month}), h('span', {text: 'answers used this month'}))));
  const max = Math.max(1, ...s.by_day.map(d => d.n));
  out.push(h('div', {class: 'card'}, h('h2', {text: 'Questions per day'}),
    h('div', {class: 'bars', role: 'img', 'aria-label': s.questions + ' questions in the last 30 days'}, s.by_day.map(d => h('i', {class: d.n ? '' : 'z', style: 'height:' + Math.max(2, Math.round(88 * d.n / max)) + 'px', title: d.day + ': ' + d.n}))),
    h('div', {class: 'axis'}, h('span', {text: s.by_day[0].day.slice(5)}), h('span', {text: 'today'}))));
  const miss = h('div', {class: 'card'}, h('h2', {text: 'Questions your documents could not answer'}), h('p', {class: 'h', text: 'Add a document that covers these, and the assistant will answer them next time.'}));
  if(O.unanswered.length) miss.append(h('div', {class: 'tw'}, h('table', {}, h('thead', {}, h('tr', {}, h('th', {text: 'Question'}), h('th', {class: 'n', text: 'Times'}), h('th', {text: 'Last asked'}))), h('tbody', {}, O.unanswered.map(m => h('tr', {}, h('td', {text: m.question}), h('td', {class: 'n', text: m.n}), h('td', {class: 'w', text: when(m.last)})))))));
  else miss.append(h('p', {class: 'empty', text: O.logging ? 'None in the last 30 days.' : 'Conversation logging is off (Settings), so this list is empty.'}));
  out.push(miss);
  if(s.helpful + s.not_helpful) out.push(h('p', {class: 'small', text: `Visitor feedback: ${s.helpful} helpful, ${s.not_helpful} not helpful.`}));
  return out;
};

/* ---------------------------------------------------------------- documents */
VIEWS.documents = async () => {
  const out = head('Documents', 'The assistant answers only from what you add here: price lists, policies, timings, FAQs, product details.');
  const msg = h('div'), list = h('div');
  async function refresh(){
    const r = await call('/kb/docs');
    if(!r.documents.length){ list.replaceChildren(h('p', {class: 'empty', text: 'Nothing yet. Add a file or your website above.'})); return; }
    list.replaceChildren(h('div', {class: 'tw'}, h('table', {}, h('thead', {}, h('tr', {}, h('th', {text: 'Document'}), h('th', {class: 'n', text: 'Parts'}), h('th', {text: 'Added'}), h('th', {}))),
      h('tbody', {}, r.documents.map(d => h('tr', {}, h('td', {text: d.name}), h('td', {class: 'n', text: d.passages}), h('td', {class: 'w', text: when(d.created_at)}),
        h('td', {class: 'w'}, sure(h('button', {class: 'btn danger small', type: 'button', text: 'Remove'}), 'Remove', async () => { await call('/kb/docs/' + d.id, undefined, 'DELETE'); refresh(); }))))))));
  }
  async function upload(files){
    for(const f of files){
      note(msg, 'Reading ' + f.name + '…', true);
      try{
        if(f.size > 20 * 1024 * 1024) throw new Error(f.name + ' is larger than 20 MB.');
        const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('The file could not be read.')); r.readAsDataURL(f); });
        const d = await call('/kb/docs', {name: f.name, file_base64: b64});
        note(msg, `Added ${d.name}: ${d.passages} parts.`, true);
      }catch(e){ note(msg, f.name + ': ' + e.message); break; }
    }
    refresh();
  }
  const file = h('input', {type: 'file', multiple: true, hidden: true, accept: '.pdf,.docx,.txt,.md,.csv,.tsv,.html,.htm,.json'});
  file.addEventListener('change', () => { upload([...file.files]); file.value = ''; });
  const drop = h('label', {class: 'drop'}, file, h('b', {text: 'Choose files'}), ' or drop them here', h('br'), h('span', {class: 'small', text: 'PDF, Word (.docx), text, CSV, HTML. Save Excel sheets as CSV. Up to 20 MB each.'}));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); upload([...e.dataTransfer.files]); });
  const url = h('input', {type: 'text', placeholder: 'https://www.yourbusiness.com', maxlength: '500', inputmode: 'url'});
  const pages = h('select', {}, h('option', {value: '1', text: 'This page only'}), h('option', {value: '5', text: 'Up to 5 pages'}), h('option', {value: '20', text: 'Up to 20 pages'}), h('option', {value: '50', text: 'Up to 50 pages'}));
  const go = h('button', {class: 'btn', type: 'submit', text: 'Add from website'});
  const form = h('form', {class: 'row'}, h('label', {class: 'f', style: 'flex:3'}, 'Website address', url), h('label', {class: 'f'}, 'How much', pages), go);
  form.addEventListener('submit', async ev => {
    ev.preventDefault(); if(!url.value.trim()) return;
    go.disabled = true; note(msg, 'Reading the website… this can take a minute.', true);
    try{ const r = await call('/kb/url', {url: url.value.trim(), pages: parseInt(pages.value, 10)}); note(msg, `Added ${r.added.length} page${r.added.length === 1 ? '' : 's'}` + (r.skipped.length ? `, skipped ${r.skipped.length} (${r.skipped[0].why})` : '') + '.', true); url.value = ''; refresh(); }
    catch(e){ note(msg, e.message); } finally{ go.disabled = false; }
  });
  const sample = h('button', {class: 'linkbtn', type: 'button', text: 'Load a made-up sample company to try it'});
  sample.addEventListener('click', async () => { try{ await call('/kb/samples', {}); note(msg, 'Sample documents added. Open "Try it" and ask something.', true); refresh(); }catch(e){ note(msg, e.message); } });
  out.push(h('div', {class: 'card'}, h('h2', {text: 'Add files'}), drop), h('div', {class: 'card'}, h('h2', {text: 'Add from your website'}), h('p', {class: 'h', text: 'It reads the text of your public pages. Pages that only show their content with JavaScript may come out empty.'}), form), msg,
    h('div', {class: 'card'}, h('h2', {text: 'Your documents'}), list, h('p', {class: 'small', style: 'margin:10px 0 0'}, sample)));
  await refresh();
  return out;
};

/* ---------------------------------------------------------------- try it */
const turns = [];
VIEWS.try = async () => {
  const out = head('Try it', 'Ask what a customer would ask. You see the full working here; visitors on your website see the answer and its source.');
  const log = h('div', {class: 'chat'}), q = h('textarea', {rows: '2', maxlength: '4000', placeholder: 'For example: What are your opening hours?', 'aria-label': 'Your question'}), go = h('button', {class: 'btn', type: 'submit', text: 'Ask'});
  function draw(){
    log.replaceChildren();
    for(const t of turns){
      if(t.role === 'user'){ log.append(h('div', {class: 'q', text: t.content})); continue; }
      const r = t.result, box = h('div', {}, tag(r.verdict), h('div', {class: 'a', style: 'margin-top:6px', text: r.answer}));
      if(r.notice) box.append(h('p', {class: 'small', style: 'color:var(--amber)', text: r.notice}));
      const d = h('details', {}, h('summary', {text: `Sources (${(r.sources || []).length}) and checks`}));
      const ul = h('ul', {class: 'small'});
      for(const c of r.checks || []) ul.append(h('li', {text: c}));
      for(const c of r.caught || []) ul.append(h('li', {}, 'Caught and sent back: ', h('span', {class: 'strike', text: c})));
      for(const c of r.removed || []) ul.append(h('li', {}, 'Removed: ', h('span', {class: 'strike', text: c})));
      d.append(ul);
      for(const s of r.sources || []) d.append(h('div', {class: 'src'}, h('b', {text: `[${s.n}] ${s.doc}${s.page ? ', page ' + s.page : ''}`}), '\n' + s.text));
      box.append(d); log.append(box);
    }
  }
  const form = h('form', {class: 'row'}, h('label', {class: 'f', style: 'flex:5'}, 'Question', q), go);
  const msg = h('div');
  form.addEventListener('submit', async ev => {
    ev.preventDefault(); const text = q.value.trim(); if(!text) return;
    go.disabled = true; go.textContent = 'Checking…'; msg.replaceChildren();
    const history = turns.map(t => ({role: t.role, content: t.content}));
    turns.push({role: 'user', content: text}); draw(); q.value = '';
    try{ const r = await call('/chat/ask', {question: text, history, mode: 'documents'}); turns.push({role: 'assistant', content: r.answer, result: r}); draw(); }
    catch(e){ turns.pop(); draw(); q.value = text; note(msg, e.message); }
    finally{ go.disabled = false; go.textContent = 'Ask'; q.focus(); }
  });
  q.addEventListener('keydown', ev => { if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); form.requestSubmit(); } });
  draw();
  out.push(h('div', {class: 'card'}, log, form, msg, turns.length ? h('p', {class: 'small', style: 'margin:10px 0 0'}, h('button', {class: 'linkbtn', type: 'button', text: 'Start over', onclick: () => { turns.length = 0; draw(); }})) : null));
  return out;
};
